name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild -project prpht.xcodeproj \
            -scheme prpht \
            -destination 'generic/platform=iOS Simulator' \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true

      - name: Report errors
        if: always()
        run: grep -E "error:" build.log | head -40 || echo "NO ERRORS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
