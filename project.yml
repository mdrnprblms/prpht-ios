# XcodeGen project spec — run `xcodegen generate` to produce prpht.xcodeproj.
name: prpht
options:
  bundleIdPrefix: com.mdrnprblms
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  prpht:
    type: application
    platform: iOS
    sources:
      - path: prpht
    resources:
      - path: prpht/Resources
      - path: prpht/Assets.xcassets
    info:
      path: prpht/Info.plist
      properties:
        CFBundleDisplayName: prpht
        UILaunchScreen: {}
        UIAppFonts:
          - ZalandoSansExpanded-1.ttf
          - ZalandoSansExpanded-2.ttf
          - ZalandoSansExpanded-3.ttf
        NSCalendarsUsageDescription: prpht uses your calendar to add fixture kickoffs and watch parties you choose.
        NSCalendarsFullAccessUsageDescription: prpht uses your calendar to add fixture kickoffs and watch parties you choose.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdrnprblms.prpht
        MARKETING_VERSION: 3.2.18
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  prpht:
    build:
      targets:
        prpht: all
    run:
      config: Debug
